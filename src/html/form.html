<div class="request-form @@class">
  <div class="form-header">
    <button class="btn-close" data-close=""></button>
    <div class="form-title">Оставьте заявку</div>
    <div class="form-subtitle">и наши специалисты свяжутся с вами в ближайшее время!</div>  
  </div>
  <div class="form-content">
    <form action="" class="form" method="post">
      <div class="form-group">
        <input class="input input-name" type="text" name="name" id="" placeholder="Ваше имя" required>
      </div>
      <div class="form-group">
        <input class="input input-email" type="text" name="email" id="email" placeholder="Ваша почта" required>
      </div>
      <div class="form-group">
        <input class="input input-tel" type="text" name="num" id="phone" placeholder="Ваш номер телефона" required>
      </div>
      <div class="form-group">
        <textarea class="input input-textarea" type="text" name="message" id="" placeholder="Ваш вопрос" required></textarea>
      </div>
      <div class="wrongNumber">Неправильный номер телефона</div>
      <div class="g-recaptcha captcha" data-sitekey="{{RECAPTCHA_SITE_KEY}}"></div>
      <div class="form-consent">
        <label class="form-consent-label">
          <input class="form-consent-checkbox" type="checkbox" name="consent" required>
          <span>Я согласен с <a href="./privacy.html" target="_blank">политикой конфиденциальности</a> и <a href="./terms.html" target="_blank">условиями использования</a></span>
        </label>
      </div>
      <button class="btn btn-danger gradient btn-form-submit" type="submit" data-modal="#thanksModal" name="submit">Позвоните мне!</button>
    </form>
  </div>
</div>
